<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#111;height:100%;overflow:hidden}#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,199.26vh);aspect-ratio:1080/542;background:#224699 url('../assets/lobby/1003.png') center/cover}#links{position:fixed;bottom:0;z-index:200;font:12px Arial}#links a{color:white;padding:4px}</style><div id="stage"></div><nav id="links"></nav><script type="module">import{createNativeHallActivities,hallActivityEntries}from'../native-hall-activities.js';const view=createNativeHallActivities(document.querySelector('#stage'));for(const[key,info]of Object.entries(hallActivityEntries)){const a=document.createElement('a');a.href='?activity='+key;a.textContent=info.name;document.querySelector('#links').append(a);}await view.show(new URL(location.href).searchParams.get('activity')||'daily');window.activityPreview=view;</script></html>
