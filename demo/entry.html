<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#244f40">
 <title>联桌麻将 · 加载</title>
 <link rel="preload" as="image" href="assets/entry/lianzhuo-loading-bg-v1.png">
 <link rel="stylesheet" href="entry.css">
</head>
<body>
 <main id="entry" aria-label="联桌麻将加载入口">
  <img class="entry-bg" src="assets/entry/lianzhuo-loading-bg-v1.png" alt="" aria-hidden="true" fetchpriority="high">
  <div class="entry-shade" aria-hidden="true"></div>
  <header class="entry-header">
   <div class="brand-symbol" aria-hidden="true"><span>联</span></div>
   <span class="brand-english">LIANZHUO MAHJONG</span>
   <span class="header-note">休闲麻将</span>
  </header>
  <section class="brand-copy" aria-labelledby="brand-title">
   <p class="eyebrow"><span></span>一桌好牌 · 轻松开局</p>
   <h1 id="brand-title">联桌麻将</h1>
   <p class="entry-tagline">牌桌已备，等你入座。</p>
  </section>

  <footer class="entry-footer"><span>适度游戏，享受生活</span><span>联桌麻将</span></footer>
 </main>
