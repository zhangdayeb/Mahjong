<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原版退出确认布局</title><style>body{margin:0;background:#101817;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:1280px;height:640px;transform:translate(-50%,-50%) scale(var(--fit));background:url('../assets/reference/desk.jpg') center/100% 100% no-repeat}#again{position:fixed;bottom:10px;left:10px;padding:8px 18px;z-index:101}#status{position:fixed;bottom:10px;right:10px;color:white;background:#002c26da;padding:6px;font:12px Arial}</style><body><main id="stage"></main><button id="again">显示原版退出确认</button><div id="status">正在读取 KeepStay 2084…</div><script type="module">

</script></body></html>
