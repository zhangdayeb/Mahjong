<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版动作横幅固定帧</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101817;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;color:#e9f7f5}#stage{position:absolute;left:50%;top:50%;width:1280px;height:640px;transform:translate(-50%,-50%) scale(var(--fit));background:url('../assets/reference/desk.jpg') center/100% 100% no-repeat;overflow:hidden}#status{position:fixed;left:12px;bottom:9px;font-size:12px;background:#00231de0;padding:7px 11px;border:1px solid #82b7a377;border-radius:5px}#controls{position:fixed;left:12px;top:9px;z-index:20}button{padding:8px 14px;border:0;margin-right:6px;color:#14352d;background:#ffe66a;border-radius:5px;cursor:pointer}</style></head>
<body><main id="stage"></main><div id="controls"><button id="replay">重播原动画</button><button id="freeze">固定帧</button></div><div id="status">正在读取原版横幅与金币序列…</div>
<script type="module">
import {createActionResultEffects} from '../action-result-effects.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),params=new URLSearchParams(location.search),name=params.get('action')||'hu',time=Number(params.get('time')??.45),seat=Number(params.get('seat')??3);
function resize(){stage.style.setProperty('--fit',Math.min(innerWidth/1280,innerHeight/640));}addEventListener('resize',resize);resize();
try{const effect=await createActionResultEffects(stage,{force:true,sound:false});function show(paused){effect.clear();const targets=params.has('multi')?[2,3]:[seat];for(const target of targets)effect.play(name,target,{time,paused});const definition=effect.definitions[name];status.textContent=`原 ${name==='qgh'?'fx_QGH_hu':'common_cpgh'}：${name} · ${paused?'固定'+time.toFixed(3)+'秒':'完整'+definition.duration.toFixed(3)+'秒'} · ${targets.map(x=>'座位'+x).join('、')} · 原座位锚点/8:9比例 · ${name==='qgh'?'30fps原扫描序列':'20fps原金币序列'}`;}document.querySelector('#replay').onclick=()=>show(false);document.querySelector('#freeze').onclick=()=>show(true);show(true);window.actionDiagnostic={effect,show};}catch(error){status.textContent=error.stack;console.error(error);}
</script></body></html>
