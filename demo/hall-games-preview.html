<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版大厅玩法页面核对</title><style>html,body{margin:0;background:#111b38;color:white;font:14px Arial,"Microsoft YaHei",sans-serif}header{height:40px;display:flex;gap:12px;align-items:center;padding:0 16px}button{color:white;background:#2c548a;border:1px solid #8eb8eb;border-radius:3px;padding:5px 14px}#stage{width:1080px;height:542px;position:relative;margin:auto;background:#3855a7}</style><header><button data-view="match">赛事中心</button><button data-view="fun">娱乐</button><button data-view="collection">玩法合集</button><button data-view="rooms" data-type="911">三国场次源模板</button><button data-view="rooms" data-type="898">生肖场次源模板</button><span>独立核对页，缺少服务器字段显示 —</span></header><main id="stage"></main><script type="module">import{createNativeHallGames}from'./native-hall-games.js';const preview=createNativeHallGames(document.querySelector('#stage'));await preview.ready;const q=new URLSearchParams(location.search);await preview.show(q.get('mode')||'match',{typeID:Number(q.get('type'))||undefined});document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>preview.show(button.dataset.view,{typeID:Number(button.dataset.type)||undefined}));</script></html>
