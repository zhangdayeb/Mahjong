<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入场与换牌素材核对</title><style>body{margin:0;background:#071e1d;color:#dff4ee;font-family:Microsoft YaHei}#stage{position:absolute;left:50%;top:50%;width:1280px;height:640px;background:url(../../assets/reference/desk.jpg) center/100% 100%;transform:translate(-50%,-50%) scale(var(--scale,1));overflow:hidden}.controls{position:fixed;left:12px;bottom:10px;z-index:130}button{font-size:14px;padding:8px 14px;margin:5px}#status{font-size:12px;padding:5px}</style></head><body><div id="stage"></div><div class="controls"><button id="loading">原加载图</button><button id="hide">关闭加载</button><button id="opposite">对家换牌截图效果</button><button id="source">对家原clip</button><button id="clockwise">顺时针换牌</button><span id="status">此页仅检查素材布局</span></div><script type="module">
import {createRoomEntry,createExchangeEffects} from '../../room-entry.js';
const stage=document.querySelector('#stage');function size(){stage.style.setProperty('--scale',String(Math.min(innerWidth/1280,innerHeight/640)));}size();addEventListener('resize',size);
const entry=createRoomEntry(stage),exchange=createExchangeEffects(stage);await exchange.ready;
document.querySelector('#loading').onclick=()=>{exchange.clear();entry.show(0)};document.querySelector('#hide').onclick=()=>entry.hide();
for(const[id,options]of[['opposite',{direction:'opposite'}],['source',{direction:'opposite',style:'source'}],['clockwise',{direction:'clockwise'}]])document.querySelector('#'+id).onclick=async()=>{entry.hide();const p=exchange.play(options);document.querySelector('#status').textContent=`播放 ${p.duration}ms`;const result=await p.finished;document.querySelector('#status').textContent=result.cancelled?'已中止':'播放结束'};
</script></body></html>
