<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原开局动画关键帧检查</title><style>body{margin:0;background:#091817;color:#eee;font:14px Microsoft YaHei}#game{position:relative;width:1280px;height:640px;background:url('../../assets/reference/desk.jpg') center/100% 100%;transform-origin:top left}#controls{position:fixed;bottom:0;background:#001b20e8;padding:8px;z-index:150}input{width:300px}button{margin-right:12px}</style><div id="game"></div><div id="controls"><button id="play">播放原开局动画</button><input id="time" type="range" min="0" max="1.1666667" step="0.01" value="0.4"><output id="label">0.40 秒</output>（原资源与关键帧；粒子随机实现存在差异）</div><script type="module">import{createOpeningEffects}from'../../opening-effects.js';const fx=createOpeningEffects(document.querySelector('#game'));const query=new URLSearchParams(location.search),value=Number(query.get('time')??.4);function resize(){game.style.transform=`scale(${Math.min(innerWidth/1280,(innerHeight-45)/640)})`;}addEventListener('resize',resize);resize();await fx.ready;await fx.preview(value);time.value=value;label.value=value.toFixed(2)+' 秒';play.onclick=()=>fx.play();time.oninput=()=>{label.value=Number(time.value).toFixed(2)+' 秒';fx.preview(Number(time.value));};window.openingFX=fx;</script></html>
