<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原操作按钮和弃牌金钻</title><style>body{background:#073b37;color:white;font:14px Microsoft YaHei;margin:0}#game{position:relative;width:1280px;height:640px;background:url('../assets/reference/desk.jpg') center/100% 100%}#buttons{position:absolute;display:flex;gap:25px;left:600px;top:410px}button.claim-button{border:0;padding:0;background:transparent;width:128px;height:134px}button.claim-hu{width:150px}button.claim-pass{width:105px;height:110px}button img{width:100%;height:100%;object-fit:contain}#gift{position:absolute;left:186px;top:73px;width:91px;height:94px}#note{position:fixed;bottom:0;padding:10px;background:#001719cc}</style><div id="game"><img id="gift" src="new-player-gift.png"><div id="buttons"></div></div><div id="note">操作按钮按原 2 秒关键帧循环；牌桌金钻按原内嵌节点、1.25 秒指针轨道和原连续星芒参数重放。</div><script type="module">import{createControlEffects,createDiscardMarker}from'../control-effects.js';const game=document.querySelector('#game'),buttons=document.querySelector('#buttons'),fx=createControlEffects(game),marker=createDiscardMarker(game);for(const kind of['hu','gang','peng','pass'])buttons.append(fx.createNativeClaimButton(kind));await Promise.all([fx.ready,marker.ready]);marker.set({x:590,y:270,visible:true,origin:true,scale:[.65,.65]});window.controlFX=fx;window.markerFX=marker;</script></html>
