<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>原版牌桌弹窗素材预览</title>
<link rel="stylesheet" href="table-panels.css">
<style>
html,body{margin:0;background:#102329;font-family:Arial,"Microsoft YaHei",sans-serif}#preview{position:relative;width:1280px;height:640px;margin:0 auto;background:#00625f url('table-layout-study/assets/common-346.png') center/782px 464px no-repeat;overflow:hidden}nav{display:flex;justify-content:center;gap:16px;padding:12px}nav button{padding:8px 18px;font-size:16px}#toast{color:#ddd;text-align:center;min-height:25px}
</style>
<div id="preview"></div>
<nav><button data-panel="emoji">表情</button><button data-panel="chat">快捷语</button><button data-panel="ledger">流水</button><button data-panel="hint">听牌</button><button data-panel="profile">资料</button></nav><p id="toast"></p>
<script type="module">
import{createTablePanels}from'./table-panels.js';
import{practiceProfiles}from'./player-display.js';
const r={config:{red:true,jokerCount:4,cap:16},phase:'play',hands:[[11,12,13,21,22,23,24,25,26,27,28,29,29],[],[],[]],melds:[[],[],[],[]],missing:[3,3,3,3],discards:[[29],[29],[],[]],wonTiles:[],scores:[12000,-4000,-4000,-4000],huEvents:[{seat:0,selfDraw:true,tile:22,fan:{name:'对对胡',multiple:2},deltas:[12000,-4000,-4000,-4000]}],kongPayments:[],log:['本预览使用明确标注的固定测试数据']};
const p=createTablePanels(document.querySelector('#preview'),{onChat:message=>document.querySelector('#toast').textContent='本地演示：'+message.text});
function show(name){if(name==='emoji'||name==='chat')p.chat(r);else if(name==='profile')p.profile(practiceProfiles[1],r,1);else p[name](r);}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.panel));show(new URLSearchParams(location.search).get('panel')||'emoji');
</script>
</html>
