<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原碰杠/胡牌特效固定帧 · 独立测试夹具</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071715;overflow:hidden;color:#dffff2;font:13px Arial,sans-serif}#stage{position:absolute;left:50%;top:50%;width:1280px;height:640px;transform:translate(-50%,-50%) scale(var(--fit,1));background:url('../assets/reference/desk.jpg') center/100% 100% no-repeat;overflow:hidden}#tools{position:fixed;left:10px;top:10px;z-index:100;background:#072d29eb;padding:8px 10px;border-radius:5px;display:flex;align-items:center;gap:8px}button,select,input{font:inherit}button,select{padding:5px 9px;border:0;border-radius:3px;background:#ffea83;color:#163c2e;cursor:pointer}#status{position:fixed;left:10px;bottom:10px;z-index:100;max-width:calc(100vw - 20px);padding:7px 10px;background:#072d29eb;border-radius:4px}#time{width:115px}#seconds{min-width:45px}.anchor{position:absolute;width:9px;height:9px;transform:translate(-50%,-50%);border:1px solid white;border-radius:50%;pointer-events:none}</style></head>
<body><main id="stage" aria-label="原特效固定帧测试舞台"></main><aside id="tools"><select id="kind" aria-label="选择特效"><option value="wind">刮风</option><option value="rain">下雨</option><option value="smoke">落牌烟雾</option><option value="hu">胡牌电光</option></select><button id="freeze">固定帧</button><button id="replay">重播</button><input id="time" aria-label="采样秒数" type="range" min="0" max="2.17" step="0.01"><output id="seconds"></output></aside><output id="status" aria-live="polite">独立视觉测试夹具：正在加载原素材…</output>
<script type="module">
import {createNativeKongEffects,nativeCPGSmokePlacement} from '../native-kong-effects.js';
import {createTileResultEffects} from '../tile-result-effects.js';
import {computeTableLayout,huTilePlacements} from '../table-layout.js';
import {meldEdge} from '../meld-study/placements.js';
const params=new URLSearchParams(location.search),stage=document.querySelector('#stage'),status=document.querySelector('#status'),kindSelect=document.querySelector('#kind'),slider=document.querySelector('#time'),seconds=document.querySelector('#seconds');
const allowed=['wind','rain','smoke','hu'];let kind=allowed.includes(params.get('kind'))?params.get('kind'):'wind',time=Math.max(0,Number(params.get('time')??.35)||0),seat=Math.max(0,Math.min(3,Math.floor(Number(params.get('seat')??3)||0))),multi=params.get('multi')==='1';
const table=computeTableLayout(1280,640),kong=createNativeKongEffects(stage,{width:1280,height:640,tableLayout:table,sound:false,force:true}),tileEffects=new Map();let meldLayout,paused=true,generation=0;
function fit(){stage.style.setProperty('--fit',String(Math.min(innerWidth/1280,innerHeight/640)));}addEventListener('resize',fit);fit();kindSelect.value=kind;slider.value=String(time);seconds.value=time.toFixed(2)+'s';
async function tileFor(target){if(!tileEffects.has(target))tileEffects.set(target,createTileResultEffects(stage,{width:1280,height:640}));const effect=tileEffects.get(target);await effect.ready;return effect;}
function targets(){return multi&&(kind==='hu'||kind==='smoke')?[seat,(seat+3)%4]:[seat];}
function clear(){kong.clear();for(const effect of tileEffects.values())effect.clear();stage.querySelectorAll('.anchor').forEach(e=>e.remove());}
function marker(point){if(!params.has('markers'))return;const e=document.createElement('i');e.className='anchor';e.style.left=point[0]+'px';e.style.top=point[1]+'px';stage.append(e);}
async function show(fixed=true){const run=++generation;paused=fixed;clear();status.dataset.ready='false';const descriptions=[];for(const target of targets()){
 if(kind==='hu'){const effect=await tileFor(target);if(run!==generation)return;const placement=huTilePlacements([11],target,table)[0],options={x:placement.x,y:placement.y,scale:table.scale,kind:'hu'};if(fixed)await effect.preview({...options,time});else effect.play(options);marker([placement.x,placement.y]);descriptions.push(`座位${target} (${placement.x.toFixed(1)},${placement.y.toFixed(1)}) Canvas×${table.scale.toFixed(4)}`);}
 else if(kind==='smoke'){const effect=await tileFor(target);if(run!==generation)return;const edge=meldEdge([{type:'peng',value:11}],target,meldLayout),placement=nativeCPGSmokePlacement(table,target,edge),options={kind:'meldSmoke',x:placement.point[0],y:placement.point[1],scaleX:placement.parentScale[0]*1.6,scaleY:placement.parentScale[1]*1.6};if(fixed)await effect.preview({...options,time});else effect.play(options);marker(placement.point);descriptions.push(`座位${target} (${placement.point.map(x=>x.toFixed(1)).join(',')}) CPG×[${placement.parentScale.map(x=>x.toFixed(4)).join(',')}]×1.6`);}
 else{kong.play({kind,seat:target,paused:fixed,timeMs:time*1000,silent:true});descriptions.push('原全桌锚点，仅播放一层');}
 }await Promise.resolve();if(run!==generation)return;status.textContent=`独立测试夹具 · ${kind} · ${fixed?'固定实际播放 '+time.toFixed(3)+' 秒':'完整播放'} · ${descriptions.join('；')} · 原1280×720→1280×640比例 · ${kind==='hu'?'HU RAW=2':'原Sprite模式'}`;status.dataset.ready='true';}
try{meldLayout=await fetch(new URL('../meld-study/layout.json',import.meta.url)).then(r=>{if(!r.ok)throw Error('CPG原布局加载失败');return r.json();});await kong.ready;document.querySelector('#freeze').onclick=()=>show(true);document.querySelector('#replay').onclick=()=>show(false);kindSelect.onchange=()=>{kind=kindSelect.value;show(true);};slider.oninput=()=>{time=Number(slider.value);seconds.value=time.toFixed(2)+'s';show(true);};await show(true);window.nativeKongDiagnostic={kong,tileEffects,table,show,get kind(){return kind;},get time(){return time;},get paused(){return paused;}};}catch(error){status.textContent=error.stack;console.error(error);}
addEventListener('pagehide',()=>{clear();kong.dispose();for(const effect of tileEffects.values())effect.destroy();},{once:true});
</script></body></html>
